name: Build Android APK

on:
  push:
    branches:
      - dioxus
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout source code
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Install Rust + Android targets
      # ------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      # ------------------------------------------
      # Setup Java
      # ------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------------------------------
      # Setup Android SDK
      # ------------------------------------------
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true


      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          which sdkmanager || true

          find "$ANDROID_HOME" \
            -maxdepth 4 \
            -type f \
            -name sdkmanager \
            -print

          sdkmanager --list | head -50
      # ------------------------------------------
      # Install Android SDK packages
      # ------------------------------------------
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      # ------------------------------------------
      # Set Android NDK
      # ------------------------------------------
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # ------------------------------------------
      # Install Dioxus CLI
      # ------------------------------------------
      - name: Install Dioxus CLI
        run: |
          curl -fsSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.dx/bin" >> "$GITHUB_PATH"

      # ------------------------------------------
      # Verify environment
      # ------------------------------------------
      - name: Check environment
        run: |
          rustc --version
          cargo --version
          dx --version
          adb version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      # ------------------------------------------
      # Build Android APK
      # ------------------------------------------
      - name: Build Android APK
        run: |
          dx bundle --android --release

      # ------------------------------------------
      # Find APK
      # ------------------------------------------
      - name: Find APK
        run: |
          find target -type f -name "*.apk" -print

      # ------------------------------------------
      # Upload APK
      # ------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-android-apk
          path: |
            target/**/*.apk
