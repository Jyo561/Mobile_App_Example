name: Dioxus Android

on:
  workflow_dispatch:
  push:
    branches:
      - dioxus

jobs:
  android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.2.12479018

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android


      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print

      - name: Install Android SDK packages
        run: |
          set -eux

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # Verify Android environment
      # --------------------------------------------------
      - name: Verify Android
        run: |
          echo "Java:"
          java -version

          echo
          echo "Rust:"
          rustc --version

          echo
          echo "Rust Android targets:"
          rustup target list --installed | grep android

          echo
          echo "Android SDK:"
          ls "$ANDROID_HOME"

          echo
          echo "NDK:"
          ls "$ANDROID_HOME/ndk"


      # --------------------------------------------------
      # Install Dioxus CLI
      # --------------------------------------------------
      - name: Install Dioxus CLI
        run: |
          cargo install dioxus-cli --locked

          dx --version


      # --------------------------------------------------
      # IMPORTANT:
      # Force ARM64 Android target
      # --------------------------------------------------
      - name: Build Dioxus Android ARM64
        run: |
          set -eux

          echo "Building for:"
          echo "aarch64-linux-android"

          dx build \
            --android \
            --release \
            --target aarch64-linux-android


      # --------------------------------------------------
      # Show everything Dioxus generated
      # --------------------------------------------------
      - name: Inspect Dioxus output
        run: |
          echo "========== APK =========="
          find target/dx \
            -type f \
            -name "*.apk" \
            -print

          echo
          echo "========== AAB =========="
          find target/dx \
            -type f \
            -name "*.aab" \
            -print

          echo
          echo "========== Android libs =========="
          find target/dx \
            -type f \
            \( -name "*.so" -o -name "*.aab" -o -name "*.apk" \) \
            -print


      # --------------------------------------------------
      # Verify APK architecture
      # --------------------------------------------------
      - name: Verify APK architecture
        run: |
          set -eux

          APK=$(find target/dx \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "APK contents:"
          unzip -l "$APK" | grep "lib/" || true

          echo
          echo "Native libraries:"
          unzip -l "$APK" \
            | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/" \
            || true

          echo
          echo "APK badging:"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" \
            | grep -E \
            "package:|sdkVersion:|targetSdkVersion:|native-code:"


      # --------------------------------------------------
      # Upload ONLY the actual APK
      # --------------------------------------------------
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-dioxus-arm64-apk
          path: |
            target/dx/**/outputs/apk/**/*.apk
          if-no-files-found: error
